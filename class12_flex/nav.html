<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0%;
            padding: 0%;
        }
        #parent{
            height: 80px;
            width: 100%;
            display: flex;
            background-color: rgb(0, 0, 0);
            justify-content: space-between;
            border-radius: 2%;

        }
        #two{
            width: 50%;
            height: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        #one{
            display: flex;
            align-items: center;
            justify-content: center;
            height: 99%;
            width: 30%;
        }
        a{
            font-size: 25px;
            color: white;
            text-decoration: none;
            
        }
        button{
            font-size: 25px;
            background-color: yellow;
            border: 0px;
            border-radius: 11px;
        }
        img{
            height: 80%;
            width: 40%;
        }
    </style>
</head>
<body>
    <div id="parent">
        <div id="one">
            <img src="./logo.png" alt="">
        </div>
        <div id="two">
            <a href="">One</a>
            <a href="">Two</a>
            <a href="">Three</a>
            <button>Contact Us</button>
        </div>
    </div>
</body>
</html>
