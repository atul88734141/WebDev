            transition: 1s;
        }
        #parent div span{

            color: rgb(247, 247, 247);
            /* background-color: aqua; */
            top: 0px;
            left: 15px;
            opacity: 0;
            transition: 1s;
        }
        #parent div:hover img{
            transform: scale(1.05);
            opacity: 0.5;

        }
        #parent div:hover div{
            visibility: 100%;
            opacity: 1;
            
        }
        #parent div:hover span{
            visibility: 100%;
            opacity: 1;
        }
        #parent div img{
            height: 100%;
            width: 100%;
            border-radius: 21px;
