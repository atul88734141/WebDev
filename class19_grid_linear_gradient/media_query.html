<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0px;
            padding: 0px;
        }
        a{
            text-decoration: none;
            color: aliceblue;
        }
        nav{
            display: flex;
            background-color: black;
            height: 50px;
            justify-content: space-evenly;
            align-items: center;
        }
        h1{
            opacity: 0;
            transition: 1s;
            text-align: center;
        }
        @media screen and (max-width:500px) {
            nav{
                display: block;
                height: fit-content;
                min-height: 70px;
                padding: 20px;
            }
            a , input{
                display: block;
                margin-top: 10px;
                margin-left: 60px;
                margin-bottom: 20px;
            }
            h1{
                opacity: 1;
            }
        }
        
    </style>
</head>
<body>
    <nav>
        <a href="#">HOME</a>
        <a href="#">PRODUCTS</a>
        <a href="#">CONTACT</a>
        <a href="#">ABOUT US</a>
        <input type="text">
    </nav>
    <br><br><br><br><br>
    <h1>LAPTOP LELE</h1>
</body>
</html>
