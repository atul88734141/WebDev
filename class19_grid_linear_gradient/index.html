<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            color: aliceblue;
        }
        body{
            background-color: black;
        }
        #parent{
            display: grid;
            grid-template-columns: 400px 400px 400px;
            grid-template-rows: 300px 300px 300px 300px 300px 300px 300px;
            gap: 20px;
            margin: 10px 80px;
        }
        #parent div{
            border: 2px solid red;
            border-radius: 21px;
        }
        #parent div p{
            font-size: 30px;
            color: aliceblue;
            text-align: center;
            margin-top: 130px;
        }
        #parent div:nth-child(1){
            background-image: linear-gradient(red, blue);
        }
        #parent div:nth-child(2){
            background-image: linear-gradient(to right,red, blue);
        }
        #parent div:nth-child(3){
            background-image: linear-gradient(to left,red, blue);
        }
        #parent div:nth-child(4){
            background-image: linear-gradient(to bottom right,red, blue);
        }
        #parent div:nth-child(5){
            background-image: linear-gradient(to bottom left,red, blue);
        }
        #parent div:nth-child(6){
            background-image: linear-gradient(45deg,red, blue);
        }#parent div:nth-child(7){
            background-image: linear-gradient(red, blue,orange,yellow,pink);
        }#parent div:nth-child(8){
            background-image: linear-gradient(red 50%, blue 50%);
        }
        
        #parent div:nth-child(9){
            background-image: radial-gradient(red,blue);
        }#parent div:nth-child(10){
            background-image: radial-gradient(circle,red,blue);
        }
        #parent div:nth-child(11){
            background-image: radial-gradient(white,red,blue,green,pink);
        }
        #parent div:nth-child(12){
            background-image: conic-gradient(red ,blue)
        }
        #parent div:nth-child(13){
            background-image: conic-gradient(red ,blue,yellow)
        }
        #parent div:nth-child(14){
            background-image: repeating-conic-gradient(red 0deg 20deg,blue 20deg 40deg)
        }
        #parent div:nth-child(15){
            background-image: repeating-linear-gradient(45deg,red 0px 20px,blue 20px 40px);
        }
        #parent div:nth-child(16){
            background-image: repeating-radial-gradient(red 0px 20px,blue 20px 50px);
        }
        #parent div:nth-child(17){
            background-image: repeating-linear-gradient(to right,grey 0px 20px,white 20px 40px);
        }
    </style>
</head>
<body>
    <center>
            <h1>CSS GRADIENT</h1>
    </center>
    <div id="parent">
        
        <div><p>Linear gradient</p></div>
        <div><p>to right</p></div>
        <div><p>to left</p></div>
        <div> <p>to bottom right</p></div>
        <div><p>to bottom left</p></div>
        <div><p>45deg</p></div>
        <div><p>multiple</p></div>
        <div><p>hard stop</p></div>
        <div><p>Gradient</p></div>
        <div><p>circle</p></div>
        <div><p>MIXED</p></div>
        <div><p>conic</p></div>
        <div><p>mixed conic</p></div>
        <div><p>repeating conic gradient</p></div>
        <div><p>repeating linear gradient</p></div>
        <div><p>repeating-radial-gradient</p></div>
        <div></div>
        <div></div>
        

    </div>
</body>
</html>
