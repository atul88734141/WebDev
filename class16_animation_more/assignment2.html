<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
            perspective: 900px;
        }
        #main{
            /* border: 2px solid; */
            display: flex;
            /* flex-wrap: nowrap; */
            margin-top: 350px;
            justify-content: center;
            height: 200px;
        }
        #main div{
            margin-left: 5px;
        }
        #ball1{
            width: 100px;
            height: 100px;
            background-image: linear-gradient(orange,yellow);
            border-radius: 50%;
            /* animation-duration: 1s;
            animation-name: b1;
            animation-iteration-count: infinite;
            animation-direction: alternate; */
            animation: b1 0.7s ease-in 0s infinite alternate;

        }
        #ball2{
            width: 100px;
            height: 100px;
            background-image: linear-gradient(skyblue,blue);
            border-radius: 50%;
            /* animation-duration: 1s;
            animation-name: b2;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            animation-delay: 0.3s; */
            animation: b1 0.1s ease-in 0.3s infinite alternate;

        }
        #ball3{
            width: 100px;
            height: 100px;
            background-image: linear-gradient(pink,rgb(255, 0, 242));
            border-radius: 50%;
            /* animation-duration: 1s;
            animation-name: b3;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            animation-delay: 0.5s; */
            animation: b1 0.7s ease-in 0.5s infinite alternate;
        }
        @keyframes b1 {
            0%{
                transform: scale(60%,60%);
                opacity: 0.5;

            }
            100%{
                transform: scale(120%,120%);
                transform: translateY(100px);
            }
        }

    </style>
</head>
<body>
    <div id="main">

        <div id="ball1"></div>
        <div id="ball2"></div>
        <div id="ball3"></div>
    </div>
    
</body>
</html>
